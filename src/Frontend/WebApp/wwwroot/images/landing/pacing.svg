600">Ritmo acima do planejado</text><text x="64" y="596" fill="#c2c6d6" font-size="19" font-weight="400">Revise a distribuição e os limites de gasto das campanhas.</text><text x="40" y="675" fill="#c2c6d6" font-size="16" font-weight="400">Exemplo ilustrativo • projeções são estimativas do ritmo observado</text></svg>