name: admetricspro

services:
  # ----------------------------------------------------------------------------
  # 1. SQL SERVER 2022
  # ----------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: admetricspro-sqlserver
    restart: unless-stopped
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data-admetricspro:/var/opt/mssql/data
    networks:
      - admetricspro-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. WEB API (.NET 10)
  # ----------------------------------------------------------------------------
  webapi:
    build:
      context: .
      dockerfile: src/Backend/WebApi/Dockerfile
    container_name: admetricspro-webapi
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ConnectionStrings__MasterDb=Server=sqlserver,1433;Database=MasterCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True;
      - DatabaseMigrations__ApplyMasterMigrationsOnStartup=${DatabaseMigrations__ApplyMasterMigrationsOnStartup:-true}
      - ImpersonationJwt__SecretKey=${ImpersonationJwt__SecretKey:-AdMetricsPro_Secret_Key_For_Tenant_Impersonation_Security_2026_Minimum_32_Chars!}
      - ImpersonationJwt__Issuer=${ImpersonationJwt__Issuer:-AdMetricsPro.Master}
      - ImpersonationJwt__Audience=${ImpersonationJwt__Audience:-AdMetricsPro.Tenants}
      - ImpersonationJwt__DefaultExpirationMinutes=${ImpersonationJwt__DefaultExpirationMinutes:-30}
      - TenantJwt__SecretKey=${TenantJwt__SecretKey:-tenants_super_secret_jwt_key_minimum_32_characters_admetricspro_2026!}
      - TenantJwt__Issuer=${TenantJwt__Issuer:-AdMetricsPro.Tenants}
      - TenantJwt__Audience=${TenantJwt__Audience:-AdMetricsPro.ClientApp}
      - TenantJwt__ExpirationMinutes=${TenantJwt__ExpirationMinutes:-480}
      # Meta: credenciais e cofre somente no backend.
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - META_OAUTH_REDIRECT_URI=${META_OAUTH_REDIRECT_URI:-http://localhost:7000/integrations}
      - Integrations__OAuth__StateSigningKey=${Integrations__OAuth__StateSigningKey:-}
      - Integrations__OAuth__TokenEncryptionKey=${Integrations__OAuth__TokenEncryptionKey:-}
      - Integrations__OAuth__Meta__DefaultScopes=${Integrations__OAuth__Meta__DefaultScopes:-ads_read,ads_management}
      - Integrations__OAuth__Meta__TimeoutSeconds=${Integrations__OAuth__Meta__TimeoutSeconds:-60}
      - Integrations__MetaSynchronization__Enabled=${Integrations__MetaSynchronization__Enabled:-false}
      - Integrations__MetaSynchronization__IntervalMinutes=${Integrations__MetaSynchronization__IntervalMinutes:-60}
      - Integrations__MetaSynchronization__LookbackDays=${Integrations__MetaSynchronization__LookbackDays:-7}
      - SuperAdmin__Email=${SuperAdmin__Email:-admin@admetricspro.internal}
      - SuperAdmin__Password=${SuperAdmin__Password:-SuperAdmin@Secure2026!}
      - SuperAdmin__FullName=${SuperAdmin__FullName:-Administrador Global AdMetricsPro}
      - SuperAdmin__Role=SuperAdmin
      - Dunning__IsEnabled=true
      - Dunning__GracePeriodDays=5
      - Dunning__RetryIntervalHours=24
    ports:
      - "${WEBAPI_PORT:-7001}:8080"
    networks:
      - admetricspro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. WEBAPP - PORTAL DO CLIENTE (BLAZOR SERVER .NET 10)
  # ----------------------------------------------------------------------------
  webapp:
    build:
      context: .
      dockerfile: src/Frontend/WebApp/Dockerfile
    container_name: admetricspro-webapp
    restart: unless-stopped
    depends_on:
      webapi:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - Api__BaseUrl=http://webapi:8080
    ports:
      - "${WEBAPP_PORT:-7000}:8080"
    networks:
      - admetricspro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. BACKOFFICE - PORTAL SUPERADMIN (BLAZOR SERVER .NET 10)
  # ----------------------------------------------------------------------------
  backoffice:
    build:
      context: .
      dockerfile: src/Frontend/BackofficeApp/Dockerfile
    container_name: admetricspro-backoffice
    restart: unless-stopped
    depends_on:
      webapi:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - Api__BaseUrl=http://webapi:8080
    ports:
      - "${BACKOFFICE_PORT:-7002}:8080"
    networks:
      - admetricspro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sqlserver-data-admetricspro:

networks:
  admetricspro-net:
    driver: bridge
