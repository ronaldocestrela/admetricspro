user nginx;
pid /var/run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Limites de upload (útil para criativos, imagens e relatórios)
    client_max_body_size 50M;

    # Mapeamento para upgrade de WebSockets (essencial para circuitos Blazor Server / SignalR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Formato de logs de acesso
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstreams para os serviços internos do Docker
    upstream webapi_backend {
        server webapi:8080;
        keepalive 32;
    }

    upstream webapp_backend {
        server webapp:8080;
        keepalive 32;
    }

    upstream backoffice_backend {
        server backoffice:8080;
        keepalive 32;
    }

    # ==========================================================================
    # 1. Servidor Principal: Portal do Cliente / Tenant (WebApp)
    # Roteia tráfego padrão ou subdomínio app.* / inquilinos CNAME
    # ==========================================================================
    server {
        listen 80;
        server_name app.localhost localhost "";

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://webapp_backend;
            proxy_http_version 1.1;

            # Configuração de WebSockets para o Blazor Server
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;

            # Timeouts estendidos para evitar expiração do circuito Blazor
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Healthcheck do Nginx
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }

    # ==========================================================================
    # 2. Servidor Administrativo: Backoffice SuperAdmin
    # Roteia admin.localhost / backoffice.*
    # ==========================================================================
    server {
        listen 80;
        server_name admin.localhost backoffice.localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://backoffice_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }

    # ==========================================================================
    # 3. Servidor Web API: api.localhost
    # Roteia chamadas externas para a Web API (OpenAPI, Webhooks de Mídia, etc.)
    # ==========================================================================
    server {
        listen 80;
        server_name api.localhost;

        location / {
            proxy_pass http://webapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
